events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 10M;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
  gzip_min_length 1024;

  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  upstream api_upstream {
    server api:4000;
    keepalive 64;
  }

  server {
    listen 80 default_server;
    server_name _;

    # --- TLS: after issuing certs (certbot), redirect http->https and add a 443 server block:
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }
    # return 301 https://$host$request_uri;

    root /var/www/public;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location = /health { proxy_pass http://api_upstream; }

    # uploads are served straight from the shared volume
    location /uploads/ {
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|woff2)$ {
      expires 7d;
      add_header Cache-Control "public";
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
